# Makes src/forecast installable with `pip install -e .`, so that
# `import forecast` and `python -m forecast.data` work from anywhere
# (tests, notebooks, the Streamlit app). Dependencies are pinned in
# requirements.txt, which is the single source of truth.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast"
version = "0.1.0"
description = "Weekly item-store demand forecasts and stocking decisions for the M5 Texas stores"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
